name: Fix formatting

# 一次性格式化 workflow：在 CI 云端跑 `pnpm fmt`，把结果导出成 patch artifact。
#
# ── 为什么不在 CI 里直接 push ──
# `pnpm fmt` 会连 `.github/workflows/*.yml` 一起格式化。GitHub Actions 的
# `permissions:` 白名单里**没有** `workflows` 这个键（actions/attestations/checks/
# contents/deployments/discussions/id-token/issues/models/packages/pages/
# pull-requests/security-events/statuses），而 workflow 文件的修改权由 token 的
# `workflow` scope 决定 —— `GITHUB_TOKEN` 永远不具备该 scope。因此任何 CI 内的
# `git push` 都会被拒：
#   refusing to allow a GitHub App to create or update workflow
#   `.github/workflows/xxx.yml` without `workflows` permission
#
# 本机 `gh` 已登录，token 带 `repo` + `workflow` scope，具备提交 workflow 文件的权限。
# 所以分工是：CI 只做「格式化 + 导出改动」，由本机 gh 完成提权推送。
#
# 用法：
#   1. 手动触发本 workflow；
#   2. 下载 oxfmt-format-patch artifact（内含 format.patch 与格式化统计）；
#   3. 在仓库根执行 git apply format.patch 后提交推送（或由本 agent 代劳）。
#
# 一次性用途：跑完让 fmt:check 恢复绿色后，本文件与 fix-lockfile.yml 一并删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ZCODE_TARGET_OS: win32
      ZCODE_TARGET_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
          run_install: false

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:HUSKY = "0"
          pnpm install --frozen-lockfile

      # ── 全量格式化 ──
      # 背景：ci.yml 的 fmt:check 在 2862 个文件里报出 2791 份 oxfmt 格式漂移。
      - name: Format all source files
        shell: pwsh
        run: pnpm fmt

      # 导出改动为 patch。
      #
      # ⚠️ 必须用 bash 的字节级重定向，不能用 pwsh 的 `| Out-File`：
      # PowerShell 会按自己的行尾重写每一行，把 git diff 输出的 LF 变成 CRLF，
      # patch 里记录的"旧内容"因此多出 \r，本机 git apply 时必然 "patch does not apply"。
      # `>` 在 bash 下是字节流直通，patch 与 git diff 原始输出逐字节一致。
      - name: Export formatting diff as patch
        shell: bash
        run: |
          mkdir -p out
          # 二进制文件（图标、字体等）无法用文本 patch 表达；单独列出以便人工确认。
          git diff --numstat | awk '$1=="-" && $2=="-" {print $3}' > out/binary-changes.txt || true
          if [ -s out/binary-changes.txt ]; then
            echo "警告：以下路径是二进制差异，文本 patch 无法覆盖："
            cat out/binary-changes.txt
          fi
          # `--binary` 让 git 对可应用的二进制差异生成 literal patch。
          git diff --binary HEAD > out/format.patch
          echo "changed_files=$(git diff --name-only HEAD | wc -l)" > out/format-stats.txt
          cat out/format-stats.txt

      # 关键：不要设置 retention-days 上限，让 artifact 默认保留，够本机下载即可。
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: oxfmt-format-patch
          path: out/
          if-no-files-found: error
          compression-level: 0
