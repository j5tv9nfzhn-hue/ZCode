name: Fix formatting

# 一次性格式化 workflow：在 CI 云端跑 `pnpm fmt` 把全仓 2791 个不合规文件的格式
# 统一成 oxfmt 的风格，然后 commit 回 main。与 fix-lockfile 同理，把本机不该跑的
# 命令搬到 CI。
#
# 唯一性：只在本 workflow 里执行 `pnpm fmt`（没有 --check）。主流程 ci.yml 的
# `pnpm fmt:check` 保持。跑完后全仓格式合规，fmt:check 恢复绿灯。

on:
  workflow_dispatch:

permissions:
  contents: write
  # 允许推送包含 .github/workflows/*.yml 格式改动的 commit。
  # 没有这一项，GitHub 会拒绝 GITHUB_TOKEN 修改 workflow 文件
  # （refusing to allow a GitHub App to create or update workflow without workflows permission）。
  workflows: write

jobs:
  fix:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ZCODE_TARGET_OS: win32
      ZCODE_TARGET_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
          run_install: false

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:HUSKY = "0"
          pnpm install --frozen-lockfile

      # ── 全量格式化 ──
      # 前置:ci.yml 的 fmt:check 在 2862 文件上发现 2791 份格式问题（oxfmt 风格漂移）。
      # 本步骤跑通过后，fmt:check 应该转为通过。
      - name: Format all source files
        shell: pwsh
        run: pnpm fmt

      # 把格式化结果 commit 回 main。幂等：如果文件原本格式都是对的，diff 为空，不提交。
      #
      # 用 gh CLI 而不是裸 git push：gh 会认 GH_TOKEN，并把凭据写进 git 的 http.extraheader，
      # 这样带 workflows 权限的 github.token 才能真正提交含 .github/workflows 改动的 commit。
      # 裸 git push 在这种情况下会被 GitHub 拒收。
      - name: Commit and push formatting fixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (git diff --quiet) {
            Write-Host "已无格式问题，无需提交。"
            exit 0
          }
          git add -A
          git commit -m "style: apply oxfmt across repo to restore fmt:check green"
          # 关键：gh 提权，让 http.extraheader 带上 workflows 权限的 token
          gh auth setup-git
          git push origin HEAD:main
