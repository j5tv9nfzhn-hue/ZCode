name: Locate max-lines offender

# 临时排查用：oxlint 的默认 reporter 在 GitHub Actions 日志里不输出文件名，
# 无法判断 405 行到底落在哪个文件。本 workflow 让 oxlint 以默认（带路径）格式
# 输出，并单独跑一次只关心 max-lines 的检查，把超限文件名打进日志。
#
# 定位完成后应删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
          run_install: false

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:HUSKY = "0"
          pnpm install --frozen-lockfile

      # -D max-lines：只保留这条规则。
      # --format=github 会把每条诊断输出成 ::error file=...,line=... —— 但只有
      # 真正 error 级别的行才带 file=。这里再额外用 --format=json 拿到结构化结果，
      # 从中精确取出 max-lines 的那一行（含 file 与实际行数）。
      - name: List files exceeding max-lines
        shell: bash
        run: |
          set +e
          pnpm exec oxlint -D max-lines --format=json > oxlint.json 2>/dev/null
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("oxlint.json", "utf8");
            // json reporter 的输出尾部可能追加了摘要行，整份 JSON.parse 会失败。
            // 这里逐个候选起点尝试解析，取第一个成功且含 diagnostics 的结果。
            let data = null;
            for (const ch of ["[", "{"]) {
              const start = raw.indexOf(ch);
              if (start < 0) continue;
              // 找到与起点配对的结束括号，截取完整片段
              let depth = 0, end = -1, inStr = false, esc = false;
              for (let i = start; i < raw.length; i++) {
                const c = raw[i];
                if (inStr) {
                  if (esc) esc = false;
                  else if (c === "\\") esc = true;
                  else if (c === "\"") inStr = false;
                  continue;
                }
                if (c === "\"") { inStr = true; continue; }
                if (c === ch) depth++;
                else if (c === (ch === "[" ? "]" : "}")) { depth--; if (depth === 0) { end = i; break; } }
              }
              if (end < 0) continue;
              try {
                const parsed = JSON.parse(raw.slice(start, end + 1));
                data = Array.isArray(parsed) ? { diagnostics: parsed } : parsed;
                break;
              } catch { /* 试下一个起点 */ }
            }
            if (!data) { console.log("MAXLINES_PARSE_FAILED"); process.exit(0); }
            const diags = data.diagnostics ?? (Array.isArray(data) ? data : []);
            const hits = [];
            for (const d of diags) {
              const msg = d.message ?? "";
              if (!/too many lines/i.test(msg)) continue;
              hits.push({ file: d.filename ?? d.filePath ?? d.labels?.[0]?.span?.file_name ?? "?", message: msg });
            }
            console.log("MAXLINES_COUNT=" + hits.length);
            for (const h of hits) console.log("MAXLINES_HIT :: " + h.file + " :: " + h.message);
          '
