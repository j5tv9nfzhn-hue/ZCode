name: Locate max-lines offender

# 临时排查用：oxlint 的默认 reporter 在 GitHub Actions 日志里不输出文件名，
# 无法判断 405 行到底落在哪个文件。本 workflow 让 oxlint 以默认（带路径）格式
# 输出，并单独跑一次只关心 max-lines 的检查，把超限文件名打进日志。
#
# 定位完成后应删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
          run_install: false

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:HUSKY = "0"
          pnpm install --frozen-lockfile

      # -D max-lines：只保留这条规则。
      # --format=github 会把每条诊断输出成 ::error file=...,line=... —— 但只有
      # 真正 error 级别的行才带 file=。这里再额外用 --format=json 拿到结构化结果，
      # 从中精确取出 max-lines 的那一行（含 file 与实际行数）。
      - name: List files exceeding max-lines
        shell: bash
        run: |
          set +e
          pnpm exec oxlint -D max-lines --format=json > oxlint.json 2>/dev/null
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("oxlint.json", "utf8");
            // json reporter 输出可能前面混有非 JSON 行，从第一个 [ 开始截取
            const start = raw.indexOf("[");
            if (start < 0) { console.log("NO_JSON_OUTPUT"); process.exit(0); }
            let data;
            try { data = JSON.parse(raw.slice(start)); }
            catch (e) { console.log("JSON_PARSE_FAIL:", e.message); process.exit(0); }
            const hits = [];
            for (const d of data.diagnostics ?? []) {
              if (!/too many lines/.test(d.message ?? "")) continue;
              hits.push({ file: d.filename ?? d.filePath ?? "?", lines: d.code ?? "?", rule: d.rule ?? d.code });
            }
            console.log("MAXLINES_HITS=" + JSON.stringify(hits, null, 2));
          '
