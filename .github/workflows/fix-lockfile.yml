name: Fix lockfile

# 一次性修复 workflow：让 CI 云端在 Windows runner 上用 --no-frozen-lockfile
# 重新生成 pnpm-lock.yaml，并把修正结果 commit 回 main。
#
# 为什么不在本机跑 `pnpm install`？仓库约定见 AGENTS.md——本仓库处于"调研/修 CI"阶段，
# 不期望本地安装工具链。本 workflow 把这步搬到 CI 云端，全程不需要本机装 pnpm。
#
# 用法：
#   1. 推送到 main；
#   2. 在 GitHub Actions 页面手动触发 "Fix lockfile"（或 `gh workflow run fix-lockfile.yml`）；
#   3. 观察它是否把同步后的 pnpm-lock.yaml commit 回 main；
#   4. 一次性后即可删除本文件，避免被误用绕过 frozen 检查。
#
# 为什么用它做一次、而不是永久把 CI 改成 --no-frozen-lockfile：
# frozen-lockfile 是保证"仓库依赖 == CI 实际安装依赖"的屏障。永久放开会让 PR 漏提交
# lockfile 时静默漂移（这轮 CI 失败的起因正是锁文件忘刷新）。这里只在修复时用
# --no-frozen-lockfile，修复后主流程继续保持 frozen。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      # 产物名只标注后端 flavor；这里产出的 lockfile 与本仓库的 flavor 无关，
      # 但显式声明目标平台，避免有人误删 ZCODE_TARGET_* 后 lockfile 里混进其他平台的原生依赖。
      ZCODE_TARGET_OS: win32
      ZCODE_TARGET_ARCH: x64
    steps:
      - uses: actions/checkout@v4

      # ⚠️  deliberately NOT using ./.github/actions/setup-zcode：
      # setup-zcode 内部的 `pnpm install --frozen-lockfile` 会在本修复前先失败。
      # 这里只需要一个最小 Node + pnpm 环境，然后靠 --no-frozen-lockfile 让 pnpm 自己同步。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
          run_install: false

      # 修复锁文件：允许 pnpm 更新 pnpm-lock.yaml，对不起被删除的包（tui / server-cli）做增量剔除。
      - name: Regenerate pnpm-lock.yaml
        shell: pwsh
        run: |
          $env:HUSKY = "0"  # 跳过 prepare=husky，CI 里无需 git hook
          pnpm install --no-frozen-lockfile

      # 把同步结果 commit 回 main。幂等：若 lockfile 本来就是最新的，则不产生提交，也不报错。
      - name: Commit and push updated lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (git diff --quiet pnpm-lock.yaml) {
            Write-Host "pnpm-lock.yaml 已与 package.json 一致，无需提交。"
            exit 0
          }
          git add pnpm-lock.yaml
          git commit -m "fix(deps): regenerate pnpm-lock.yaml to match package.json"
          git push
